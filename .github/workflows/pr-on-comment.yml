name: PR Preview (On Comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy-comment-preview:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/preview')
    runs-on: ubuntu-latest
    steps:
      # 1. Реакция 👀 на комментарий
      - name: Add Eyes Reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      # 2. Создаем первый комментарий: "Build started"
      - name: Create Status Comment
        id: status-comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ⏳ **Build started!**
            
            * **Triggered by:** @${{ github.actor }}
            * **Action run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            *Running Vale linting, building Hugo site and deploying to Surge preview...*

      # 3. Выкачиваем код из PR
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          submodules: recursive
          fetch-depth: 0

      # 4. Установка и запуск Vale CLI (без ANSI-мусора)
      - name: Run Vale (Debug Mode)
        id: vale
        continue-on-error: true
        if: ${{ matrix.target == 'vale' && github.event_name == 'pull_request' }}
        run: |
          VALE_VERSION="3.3.0"
          curl -sfL https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/vale /usr/local/bin/

          echo "=== 1. VALE VERSION & CONFIG CHECK ==="
          vale version
          echo "Current directory: $(pwd)"
          echo "Config file check:"
          ls -la .vale.ini || echo "NO .vale.ini FOUND!"
          echo "Styles directory check:"
          ls -la _vale || echo "NO _vale DIR FOUND!"

          echo -e "\n=== 2. GIT DIFF CHECK ==="
          git fetch origin ${{ github.base_ref }} --depth=100 || true
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.md$' || true)
          echo "Changed .md files:"
          echo "$CHANGED_FILES"

          echo -e "\n=== 3. RAW VALE RUN ON CONTENT/ ==="
          mkdir -p ./tmp
          vale --output=line content/ > ./tmp/vale.out 2>&1 || true
          echo "Total lines in vale.out: $(wc -l < ./tmp/vale.out)"
          echo "First 15 lines of vale.out:"
          head -n 15 ./tmp/vale.out

          echo -e "\n=== 4. RAW VALE RUN ON DIRECT FILE (TEST) ==="
          if [ -n "$CHANGED_FILES" ]; then
            FIRST_FILE=$(echo "$CHANGED_FILES" | head -n 1)
            echo "Testing Vale directly on: $FIRST_FILE"
            vale --output=line "$FIRST_FILE" || true
          fi

          echo -e "\n=== 5. FILTERING PROCESS ==="
          if [ -z "$CHANGED_FILES" ]; then
            OUTPUT="[DEBUG] No Markdown files detected in git diff."
          else
            PATTERN=$(echo "$CHANGED_FILES" | paste -sd '|' -)
            echo "Grepping with pattern: $PATTERN"
            OUTPUT=$(grep -E "$PATTERN" ./tmp/vale.out || true)
            
            if [ -z "$OUTPUT" ]; then
              OUTPUT="[DEBUG] Diff detected files, but grep matched nothing in vale.out."
            fi
          fi

          echo -e "\n=== 6. FINAL OUTPUT TO BE SENT TO COMMENT ==="
          echo "$OUTPUT"

          # Формирование вывода для PR
          if [ ${#OUTPUT} -gt 60000 ]; then
            OUTPUT="${OUTPUT:0:60000}...\n\n(Output truncated due to size limit)"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "vale_output<<$EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      # 5. Настраиваем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 6. Устанавливаем JS-пакеты
      - name: Install Node Dependencies
        run: npm ci

      # 7. Устанавливаем Hugo Extended
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 8. Собираем статику Hugo
      - name: Build Hugo Site
        run: |
          hugo \
            --cleanDestinationDir \
            --minify \
            --baseURL "https://${{ secrets.SURGE_DOMAIN }}-pr-${{ github.event.issue.number }}.surge.sh/"

      # 9. Очистка ненужных папок
      - name: Trim Public Folder for Preview
        run: |
          rm -rf ./public/assets/video
          rm -rf ./public/ai
          rm -rf ./public/reference
          rm -rf ./public/desktop
          rm -rf ./public/guides
          rm -rf ./public/archives
          rm -rf ./public/engine/release-notes
          
          if [ -f .surgeignore ]; then
            cp .surgeignore ./public/.surgeignore
          fi

          echo "=== Top 15 largest directories in ./public ==="
          du -sh ./public/* | sort -rh | head -n 15

          echo "=== Final Size of ./public ==="
          du -sh ./public

      # 10. Деплоим на Surge
      - name: Deploy Preview to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx surge ./public "${{ secrets.SURGE_DOMAIN }}-pr-${{ github.event.issue.number }}.surge.sh"

      # 11. Редактируем стартовый комментарий на финальный (Preview + Vale)
      - name: Update Comment with Preview URL and Vale Report
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.status-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            🚀 **Preview is ready!**
            
            🔍 **Link:** https://${{ secrets.SURGE_DOMAIN }}-pr-${{ github.event.issue.number }}.surge.sh/

            <details>
            <summary>📝 <b>Vale Lint Report</b></summary>

            ```text
            ${{ steps.vale.outputs.vale_output }}
            ```

            </details>
            
            ---
            *Last updated at: ${{ github.event.comment.created_at }}*