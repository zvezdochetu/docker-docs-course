name: PR Preview (On Comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy-comment-preview:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/preview')
    runs-on: ubuntu-latest
    steps:
      # 1. Добавляем реакцию 👀 на комментарий
      - name: Add Eyes Reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      # 2. Выкачиваем код из PR
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          submodules: recursive
          fetch-depth: 0

      # 3. Настраиваем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 4. Устанавливаем JS-пакеты (Alpine.js, highlight.js и др.)
      - name: Install Node Dependencies
        run: npm ci

      # 5. Устанавливаем Hugo Extended
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 6. Собираем статику Hugo под домен текущего PR
      - name: Build Hugo Site
        run: |
          hugo \
            --cleanDestinationDir \
            --minify \
            --baseURL "https://${{ secrets.SURGE_DOMAIN }}-pr-${{ github.event.issue.number }}.surge.sh/"

      # 7. Агрессивная очистка тяжелых разделов для влезания в лимит Surge
      - name: Trim Public Folder for Preview
        run: |
          # Удаляем медиафайлы и ИИ-разделы
          rm -rf ./public/assets/video
          rm -rf ./public/ai
          
          # Удаляем громоздкую справочную документацию и релиз-ноутс
          rm -rf ./public/reference
          rm -rf ./public/desktop/release-notes
          
          # Копируем .surgeignore из корня репозитория в public/
          if [ -f .surgeignore ]; then
            cp .surgeignore ./public/.surgeignore
          fi

          echo "=== Size of ./public after trimming ==="
          du -sh ./public

      # 8. Деплоим облегченную папку ./public на Surge
      - name: Deploy Preview to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx surge ./public "${{ secrets.SURGE_DOMAIN }}-pr-${{ github.event.issue.number }}.surge.sh"

      # 9. Публикуем комментарий с итоговой ссылкой
      - name: Post Preview URL in PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            🚀 **Preview is ready!**
            
            🔍 **Link:** https://${{ secrets.SURGE_DOMAIN }}-pr-${{ github.event.issue.number }}.surge.sh/