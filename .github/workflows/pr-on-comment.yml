name: PR Preview (On Comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy-comment-preview:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/preview')
    runs-on: ubuntu-latest
    steps:
      # 1. Реакция 👀 на комментарий
      - name: Add Eyes Reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      # 2. Выкачиваем код из PR
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          submodules: recursive
          fetch-depth: 0

      # 3. Настраиваем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 4. Устанавливаем JS-пакеты (Alpine.js, highlight.js и др.)
      - name: Install Node Dependencies
        run: npm ci

      # 5. Устанавливаем Hugo Extended
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 6. Собираем статику Hugo с очисткой папки назначения
      - name: Build Hugo Site
        run: |
          hugo \
            --cleanDestinationDir \
            --minify \
            --baseURL "https://${{ secrets.SURGE_DOMAIN }}-pr-${{ github.event.issue.number }}.surge.sh/"

      # ДИАГНОСТИКА: Показывает вес папки и 10 самых тяжелых файлов
      - name: Check Public Directory Size
        run: |
          echo "=== Total size of ./public ==="
          du -sh ./public
          echo "=== Top 10 largest files in ./public ==="
          find ./public -type f -exec du -h {} + | sort -rh | head -n 10

      # ДИАГНОСТИКА: Показывает вес папки и 10 самых тяжелых файлов
      - name: Check Public Directory Size
        run: |
          echo "=== Total size of ./public ==="
          du -sh ./public
          echo "=== Top 10 largest files in ./public ==="
          find ./public -type f -exec du -h {} + | sort -rh | head -n 10

      # 8. Деплоим облегченную папку ./public
      - name: Deploy Preview to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx surge ./public "${{ secrets.SURGE_DOMAIN }}-pr-${{ github.event.issue.number }}.surge.sh"