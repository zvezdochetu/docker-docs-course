name: Vale Lint (On Comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  vale-lint-comment:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/vale')
    runs-on: ubuntu-latest
    steps:
      # 1. Реакция 👀 на комментарий
      - name: Add Eyes Reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      # 2. Создаем начальный комментарий со статусом
      - name: Create Status Comment
        id: status-comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ⏳ **Vale linting (PR diff only) started...**
            
            * **Triggered by:** @${{ github.actor }}
            * **Action run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # 3. Выкачиваем код PR
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

# 4. Запуск Vale и отправка inline-комментариев напрямую через GitHub API
      - name: Run Vale and Post Inline Comments
        id: vale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Установка Vale CLI
          VALE_VERSION="3.3.0"
          curl -sfL https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/vale /usr/local/bin/

          # 2. Получение ветки и последней ревизии PR
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})
          TARGET_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref' | tr -d '\r\n')
          COMMIT_ID=$(echo "$PR_JSON" | jq -r '.head.sha')

          git fetch origin "$TARGET_BRANCH"

          # 3. Находим измененные .md файлы
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "origin/$TARGET_BRANCH...HEAD" -- '*.md')

          if [ -z "$CHANGED_FILES" ]; then
            OUTPUT="No modified Markdown files in this PR."
          else
            echo "Found modified Markdown files:"
            echo "$CHANGED_FILES"

            # 4. Получаем диффы с номерами строк для фильтрации
            # Запускаем Vale
            VALE_RESULTS=$(echo "$CHANGED_FILES" | xargs vale --output=line 2>&1 || true)
            OUTPUT="$VALE_RESULTS"

            # 5. Публикуем комментарии напрямую в файлы PR
            echo "$VALE_RESULTS" | while IFS= read -r line; do
              if [[ "$line" =~ ^([^:]+):([0-9]+):([0-9]+):(.*)$ ]]; then
                FILE="${BASH_REMATCH[1]}"
                LINE_NUM="${BASH_REMATCH[2]}"
                MSG="${BASH_REMATCH[4]}"

                # Проверяем, входит ли строка в текущий diff PR
                if git diff "origin/$TARGET_BRANCH...HEAD" -- "$FILE" | grep -q "@@ .* +${LINE_NUM}"; then
                  gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/comments" \
                    -f body="📝 **Vale Lint:** ${MSG}" \
                    -f commit_id="$COMMIT_ID" \
                    -f path="$FILE" \
                    -F line="$LINE_NUM" \
                    -f side="RIGHT" || true
                fi
              fi
            done
          fi

          if [ -z "$OUTPUT" ]; then
            OUTPUT="No linting issues found!"
          fi

          # 6. Запись вывода в GITHUB_OUTPUT
          DELIMITER="EOF_VALE_${RANDOM}"
          echo "vale_output<<${DELIMITER}" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

      # 5. Обновление комментария результатом работы Vale
      - name: Update Comment with Vale Report
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.status-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            📝 **Vale Lint Completed (PR Diff Only)**

            <details>
            <summary>🔍 <b>View Vale Lint Report</b></summary>

            ```text
            ${{ steps.vale.outputs.vale_output }}
            ```

            </details>
            
            ---
            *Last updated at: ${{ github.event.comment.created_at }}*