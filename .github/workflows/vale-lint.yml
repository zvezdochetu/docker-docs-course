name: Vale Lint (On Comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  vale-lint-comment:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/vale')
    runs-on: ubuntu-latest
    steps:
      # 1. Реакция 👀 на комментарий
      - name: Add Eyes Reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      # 2. Создаем начальный комментарий со статусом
      - name: Create Status Comment
        id: status-comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ⏳ **Vale linting (PR diff only) started...**
            
            * **Triggered by:** @${{ github.actor }}
            * **Action run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # 3. Выкачиваем код PR
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      # 4. Запуск Vale CLI с фильтрацией через Reviewdog
      - name: Run Vale and Filter with Reviewdog
        id: vale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_VERSION: "v0.20.3"
        run: |
          # 1. Установка Vale CLI
          VALE_VERSION="3.3.0"
          curl -sfL https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/vale /usr/local/bin/

          # 2. Установка Reviewdog CLI
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /tmp ${REVIEWDOG_VERSION}
          sudo mv /tmp/reviewdog /usr/local/bin/

          # 3. Определение целевой ветки PR
          TARGET_BRANCH=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} --jq '.base.ref' | tr -d '\r\n')
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="main"
          fi

          echo "Target branch: origin/$TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH"

          # 4. Список измененных Markdown-файлов
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "origin/$TARGET_BRANCH...HEAD" -- '*.md')

          if [ -z "$CHANGED_FILES" ]; then
            OUTPUT="No modified Markdown files in this PR."
          else
            echo "Found modified Markdown files:"
            echo "$CHANGED_FILES"

            # 5. Запуск Vale с выводом --output=line и парсинг через -efm="%f:%l:%c:%m"
            OUTPUT=$(echo "$CHANGED_FILES" | xargs vale --output=line 2>&1 | reviewdog -efm="%f:%l:%c:%m" -diff="git diff origin/$TARGET_BRANCH...HEAD" -filter-mode=diff_context -reporter=local 2>&1) || true
          fi

          if [ -z "$OUTPUT" ]; then
            OUTPUT="No linting issues found in modified lines!"
          fi

          # 6. Обрезка по размеру для комментария
          if [ ${#OUTPUT} -gt 60000 ]; then
            OUTPUT="${OUTPUT:0:60000}...\n\n(Output truncated due to size limit)"
          fi

          # 7. Запись вывода в GITHUB_OUTPUT
          DELIMITER="EOF_VALE_${RANDOM}"
          echo "vale_output<<${DELIMITER}" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

      # 5. Обновление комментария результатом работы Vale
      - name: Update Comment with Vale Report
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.status-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            📝 **Vale Lint Completed (PR Diff Only)**

            <details>
            <summary>🔍 <b>View Vale Lint Report</b></summary>

            ```text
            ${{ steps.vale.outputs.vale_output }}
            ```

            </details>
            
            ---
            *Last updated at: ${{ github.event.comment.created_at }}*