name: Vale Lint (On Comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  vale-lint-comment:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/vale')
    runs-on: ubuntu-latest
    steps:
      # 1. Реакция 👀 на комментарий
      - name: Add Eyes Reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      # 2. Создаем начальный комментарий со статусом
      - name: Create Status Comment
        id: status-comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ⏳ **Vale linting (PR diff only) started...**
            
            * **Triggered by:** @${{ github.actor }}
            * **Action run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # 3. Выкачиваем код PR
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

# 4. Мульти-вариантный тест отправки комментариев через Reviewdog
      - name: Debug Reviewdog Reporters
        id: vale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_VERSION: "v0.20.3"
        run: |
          # 1. Установка утилит
          VALE_VERSION="3.3.0"
          curl -sfL https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/vale /usr/local/bin/

          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /tmp ${REVIEWDOG_VERSION}
          sudo mv /tmp/reviewdog /usr/local/bin/

          # 2. Подготовка диффа
          TARGET_BRANCH=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} --jq '.base.ref' | tr -d '\r\n')
          git fetch origin "$TARGET_BRANCH"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "origin/$TARGET_BRANCH...HEAD" -- '*.md')

          echo "Target branch: origin/$TARGET_BRANCH"
          echo "Files: $CHANGED_FILES"

          # Генерируем тестовый вывод Vale в файл
          echo "$CHANGED_FILES" | xargs vale --output=line 2>&1 > vale_output.txt || true
          echo "=== VALE OUTPUT ==="
          cat vale_output.txt

          echo -e "\n=========================================="
          echo "TEST 1: Standard github-pr-review with CI_PULL_REQUEST"
          echo "=========================================="
          CI_PULL_REQUEST=${{ github.event.issue.number }} \
          reviewdog -efm="%f:%l:%c:%m" -diff="git diff origin/$TARGET_BRANCH...HEAD" -filter-mode=diff_context -reporter=github-pr-review < vale_output.txt 2>&1 || true

          echo -e "\n=========================================="
          echo "TEST 2: github-pr-comment (Issue/PR comment API)"
          echo "=========================================="
          CI_PULL_REQUEST=${{ github.event.issue.number }} \
          reviewdog -efm="%f:%l:%c:%m" -diff="git diff origin/$TARGET_BRANCH...HEAD" -filter-mode=diff_context -reporter=github-pr-comment < vale_output.txt 2>&1 || true

          echo -e "\n=========================================="
          echo "TEST 3: Full environment override (GITHUB_EVENT_NAME=pull_request)"
          echo "=========================================="
          GITHUB_EVENT_NAME=pull_request \
          PR_NUMBER=${{ github.event.issue.number }} \
          CI_PULL_REQUEST=${{ github.event.issue.number }} \
          reviewdog -efm="%f:%l:%c:%m" -diff="git diff origin/$TARGET_BRANCH...HEAD" -filter-mode=diff_context -reporter=github-pr-review < vale_output.txt 2>&1 || true

          echo -e "\n=========================================="
          echo "TEST 4: github-pr-check reporter"
          echo "=========================================="
          CI_PULL_REQUEST=${{ github.event.issue.number }} \
          reviewdog -efm="%f:%l:%c:%m" -diff="git diff origin/$TARGET_BRANCH...HEAD" -filter-mode=diff_context -reporter=github-pr-check < vale_output.txt 2>&1 || true

          # Вывод для шага
          echo "vale_output=Check workflow logs to see which test succeeded." >> $GITHUB_OUTPUT

      # 5. Обновление комментария результатом работы Vale
      - name: Update Comment with Vale Report
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.status-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            📝 **Vale Lint Completed (PR Diff Only)**

            <details>
            <summary>🔍 <b>View Vale Lint Report</b></summary>

            ```text
            ${{ steps.vale.outputs.vale_output }}
            ```

            </details>
            
            ---
            *Last updated at: ${{ github.event.comment.created_at }}*