name: Vale Lint (On Comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  vale-lint-comment:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/vale')
    runs-on: ubuntu-latest
    steps:
      # 1. Реакция 👀 на комментарий
      - name: Add Eyes Reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      # 2. Создаем начальный комментарий со статусом
      - name: Create Status Comment
        id: status-comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ⏳ **Vale linting (PR diff only) started...**
            
            * **Triggered by:** @${{ github.actor }}
            * **Action run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # 3. Выкачиваем код PR
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      # 4. Запуск Vale CLI с фильтрацией через Reviewdog
# 4. Отладочный запуск для диагностики Git-окружения
      - name: Debug Git Environment and Diff
        id: vale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 1. ТЕКУЩИЕ ВЕТКИ И HEAD ==="
          git status
          echo "Current branch/commit: $(git rev-parse HEAD)"
          echo "All local branches:"
          git branch -a

          echo -e "\n=== 2. ОПРЕДЕЛЕНИЕ BASE BRANCH ==="
          TARGET_BRANCH=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} --jq '.base.ref' | tr -d '\r\n')
          echo "Target branch from API: '$TARGET_BRANCH'"

          echo -e "\n=== 3. FETCH И ПРОВЕРКА REMOTE ==="
          git fetch origin "$TARGET_BRANCH" --verbose
          echo "Remote branches after fetch:"
          git branch -r

          echo -e "\n=== 4. ПРОВЕРКА MERGE-BASE (ОБЩЕГО ПРЕДКА) ==="
          MERGE_BASE=$(git merge-base HEAD "origin/$TARGET_BRANCH" || true)
          echo "Merge base commit: '$MERGE_BASE'"

          echo -e "\n=== 5. ТЕСТ СРАВНЕНИЯ (VARIANTS OF GIT DIFF) ==="
          echo "--- Variant A: git diff --name-only origin/$TARGET_BRANCH ---"
          git diff --name-only "origin/$TARGET_BRANCH" || true

          echo "--- Variant B: git diff --name-only origin/$TARGET_BRANCH...HEAD ---"
          git diff --name-only "origin/$TARGET_BRANCH...HEAD" || true

          echo "--- Variant C: git diff --name-only FETCH_HEAD...HEAD ---"
          git diff --name-only FETCH_HEAD...HEAD || true

          echo -e "\n=== 6. ПОИСК ВСЕХ MD ФАЙЛОВ В КОММИТЕ ==="
          git show --stat HEAD

          # Временный вывод в GITHUB_OUTPUT для завершения шага
          echo "vale_output=Check Actions logs for full diagnostic trace." >> $GITHUB_OUTPUT

      # 5. Обновление комментария результатом работы Vale
      - name: Update Comment with Vale Report
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.status-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            📝 **Vale Lint Completed (PR Diff Only)**

            <details>
            <summary>🔍 <b>View Vale Lint Report</b></summary>

            ```text
            ${{ steps.vale.outputs.vale_output }}
            ```

            </details>
            
            ---
            *Last updated at: ${{ github.event.comment.created_at }}*