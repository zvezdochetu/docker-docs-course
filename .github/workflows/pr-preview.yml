name: PR Preview (On Comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write # Обязательно для создания/обновления комментариев
  statuses: write      # Нужно для выставления галочек проверки

jobs:
  deploy-comment-preview:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/preview')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          submodules: recursive
          fetch-depth: 0

      # Реакция 👀 на комментарий пользователя, чтобы сразу дать визуальный отклик
      - name: Add Eyes Reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo Site
        run: |
          hugo \
            --minify \
            --baseURL "https://${{ secrets.SURGE_DOMAIN }}-pr-${{ github.event.issue.number }}.surge.sh/"

      - name: Deploy Preview to Surge & Post Comment
        uses: afc163/surge-preview@v1
        with:
          surge_token: ${{ secrets.SURGE_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.issue.number }} # Явно передаем номер PR
          dist: './public'
          build: ''